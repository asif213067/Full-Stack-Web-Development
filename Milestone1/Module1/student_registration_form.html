<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <main>
      <h1>Student Registration Form</h1>

      <form>
        <fieldset>
          <legend>Personal Details</legend>

          <label for="name">Full Name</label><br />
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            maxlength="50"
            required
          /><br /><br />

          <label for="email">Email</label> <br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            maxlength="100"
            required
          /><br /><br />

          <label for="password">Password</label><br />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="At least 8 characters"
            minlength="8"
            maxlength="20"
            required
          /><br /><br />

          <label for="phone">Phone Number</label><br />
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="e.g. 01XXXXXXXXX"
            maxlength="15"
            required
          /><br /><br />

          <label for="dob">Date of Birth</label><br />
          <input type="date" id="dob" name="dob" required /><br /><br />
        </fieldset>

        <fieldset>
          <legend>Gender</legend>
          <label
            ><input type="radio" name="gender" value="male" required />
            Male</label
          >
          <label
            ><input type="radio" name="gender" value="female" /> Female</label
          >
          <label
            ><input type="radio" name="gender" value="other" /> Other</label
          >
        </fieldset>

        <fieldset>
          <legend>Skills</legend>
          <label
            ><input type="checkbox" name="skills" value="html" /> HTML</label
          >
          <label><input type="checkbox" name="skills" value="css" /> CSS</label>
          <label
            ><input type="checkbox" name="skills" value="javascript" />
            JavaScript</label
          >
          <label
            ><input type="checkbox" name="skills" value="react" /> React</label
          >
          <label
            ><input type="checkbox" name="skills" value="python" />
            Python</label
          >
        </fieldset>

        <fieldset>
          <legend>Academic Details</legend>

          <label for="department">Department</label><br />
          <select id="department" name="department" required>
            <option value="">-- Select Department --</option>
            <option value="cse">Computer Science &amp; Engineering</option>
            <option value="eee">Electrical &amp; Electronic Engineering</option>
            <option value="bba">Business Administration</option>
            <option value="english">English</option>
            <option value="other">Other</option></select
          ><br /><br />

          <label for="studentId">Student ID</label><br />
          <input
            type="text"
            id="studentId"
            name="studentId"
            value="AUTO-GENERATED"
            readonly
          /><br /><br />
        </fieldset>

        <fieldset>
          <legend>Address</legend>
          <label for="address">Address</label><br />
          <textarea
            id="address"
            name="address"
            placeholder="Enter your present address"
            maxlength="200"
            cols="25"
            rows="5"
          ></textarea>
        </fieldset>

        <fieldset>
          <legend>Other</legend>

          <label for="country">Country</label><br />
          <input
            type="text"
            id="country"
            name="country"
            value="Bangladesh"
            disabled
          /><br /><br />

          <label for="profilePic">Profile Picture</label><br />
          <input
            type="file"
            id="profilePic"
            name="profilePic"
            accept="image/*"
          />
        </fieldset>

        <br />
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
    </main>
  </body>
</html>
