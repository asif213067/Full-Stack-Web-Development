<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-green-400 text-[200px] bg-[url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300')] bg-center bg-cover">Hello World</h1>

    <h3 class="bg-purple-400 border-4 rounded-2xl text-[50px] md:text-[100px] h-50 text-center font-bold  ">Don Shop</h3>

    <h2 class="font-bold text-3xl text-blue-500 mt-12 mb-4 p-4 ">Layout Using Flex</h2>
    <div class="flex flex-col md:flex-row gap-2 m-2 ">
      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center">Box 1</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center">Box 2</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center">Box 3</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center">Box 4</div>
    </div>

    <h2 class="font-bold text-3xl text-blue-500 mt-12 mb-4 p-4 ">Layout Using Grid</h2>
    <div class="grid grid-cols-1 md:grid-cols-12 gap-2">
      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-4">Box 1</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-2">Box 2</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-4">Box 3</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-2">Box 4</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-4">Box 5</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-2">Box 6</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-4">Box 7</div>

      <div class="bg-amber-200 text-3xl font-bold w-full h-60 border-2 rounded-3xl  flex justify-center items-center col-span-1 md:col-span-2">Box 8</div>
    </div>

    <h3 class="test">My first responsive element</h3>

    <div class="mx-auto max-w-3xl p-6">
      <!-- Cart Item -->
      <div
        class="flex items-center gap-5 rounded-xl border border-gray-200 bg-white p-4 shadow-sm"
      >
        <!-- Product Image -->
        <img
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300"
          alt="Nike Red Shoes"
          class="h-24 w-24 rounded-lg object-cover"
        />

        <!-- Product Information -->
        <div class="flex-1">
          <h2 class="text-lg font-semibold text-gray-900">Nike Red Shoes</h2>

          <p class="mt-1 text-sm text-gray-500">Size: 42</p>

          <p class="mt-2 text-lg font-bold text-gray-900">$89.99</p>
        </div>

        <!-- Quantity -->
        <div class="flex items-center rounded-lg border border-gray-300">
          <button class="px-3 py-1 text-lg text-gray-600 hover:bg-gray-100">
            −
          </button>

          <span class="px-3 py-1 font-medium"> 1 </span>

          <button class="px-3 py-1 text-lg text-gray-600 hover:bg-gray-100">
            +
          </button>
        </div>

        <!-- Remove Button -->
        <button class="text-sm font-medium text-red-500 hover:text-red-700">
          Remove
        </button>
      </div>
    </div>
  </body>
</html>
